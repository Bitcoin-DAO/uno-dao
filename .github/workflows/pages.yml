# Builds the app with this repository's config/dao.json and publishes it to GitHub Pages.
# Runs only in a DAO's own copy of btc-dao (one that has config/dao.json).
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          if [ -f config/dao.json ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.cfg.outputs.has == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - if: steps.cfg.outputs.has == 'true'
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
      - if: steps.cfg.outputs.has == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
    outputs:
      has: ${{ steps.cfg.outputs.has }}

  deploy:
    needs: build
    if: needs.build.outputs.has == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
