# Change name if you feel like it
name = "btc-dao-relay"
compatibility_date = "2025-01-04"
main = "worker.js"

# Durable Objects binding
[[durable_objects.bindings]]
name = "RELAY_WEBSOCKET"
class_name = "RelayWebSocket"

# D1 Database binding
# Important! Change name and id settings to your own
[[d1_databases]]
binding = "RELAY_DATABASE"
database_name = "bosa-dao-relay" # created before the project went generic; D1 names cannot change, the id is what counts
database_id = "c759c9d9-a121-4a2d-9d80-8cca1cdf3f71"

# Cron trigger for 24hr database maintenance
[triggers]
crons = ["0 0 * * *"]

# btc-dao: no [limits] block, so it deploys on the free Workers plan

# Enable logs (off by default, but can enable)
[observability.logs]
enabled = false

# Durable Object migration with SQLite storage backend
[[migrations]]
tag = "v4"
new_sqlite_classes = ["RelayWebSocket"]